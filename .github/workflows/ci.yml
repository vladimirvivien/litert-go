name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build / vet / test / lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: go mod tidy check
        run: |
          go mod tidy
          if ! git diff --exit-code; then
            echo "::error::go.mod or go.sum is not tidy. Run 'go mod tidy' locally."
            exit 1
          fi

      - name: go fix & fmt check
        run: |
          go fix ./...
          go fmt ./...
          if ! git diff --exit-code; then
            echo "::error::Code has pending fixes or formatting. Run 'go fix ./...' and 'go fmt ./...' locally."
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

  integration:
    name: runtime integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Cache LiteRT 2.4.1 prebuilts
        uses: actions/cache@v6
        with:
          path: .cache/litert-2.4.1
          key: litert-2.4.1-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Download LiteRT 2.4.1 prebuilts
        run: go run ./examples/libfetch -dir .cache/litert-2.4.1 -version 2.4.1

      - name: Run live LiteRT runtime integration tests
        env:
          LITERT_LIB: ${{ github.workspace }}/.cache/litert-2.4.1
        run: go test -race -v ./pkg/litert/...
